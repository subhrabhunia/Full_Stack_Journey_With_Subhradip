<!-- JavaScript provides built-in array methods to arrange array elements in order or reverse their order.
- sort() – sorts array elements.
- reverse() – reverses the order of array elements.
The sort() method is used to sort array elements. By default, it sorts values as strings in ascending lexicographical order.
The reverse() method is used to reverse the order of array elements. The last element becomes the first, and the first element becomes the last. -->
