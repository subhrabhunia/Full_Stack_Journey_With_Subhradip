<!-- ### **Difference Between Global and Local Variables**

| Global Variable                                               | Local Variable                                           |
| ------------------------------------------------------------- | -------------------------------------------------------- |
| Declared outside a function.                                  | Declared inside a function.                              |
| Can be accessed from different parts of its accessible scope. | Can be accessed only inside its function or block scope. |
| Exists while its scope is active.                             | Exists while its function or block scope is active.      |
| Example: `var name = "Subhradip";`                            | Example: `var age = 22;` inside a function.              | -->
