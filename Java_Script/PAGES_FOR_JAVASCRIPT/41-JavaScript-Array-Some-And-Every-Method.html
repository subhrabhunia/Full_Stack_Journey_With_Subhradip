<!-- The some() and every() methods are used to check conditions on array elements. They work with a callback function and return a Boolean value (true or false).
- some() → Checks whether at least one element satisfies the condition.
- every() → Checks whether all elements satisfy the condition.
The some() method checks whether at least one element in an array passes the given condition.

If even one element satisfies the condition, it returns true. Otherwise, it returns false. 
The every() method checks whether all elements in an array satisfy the given condition.

If all elements satisfy the condition, it returns true. If even one element fails, it returns false.-->
<!-- <Syntax:->
    array.some(function(value) {
    return condition;
});

array.every(function(value) {
    return condition;
});
</Syntax:-> -->
