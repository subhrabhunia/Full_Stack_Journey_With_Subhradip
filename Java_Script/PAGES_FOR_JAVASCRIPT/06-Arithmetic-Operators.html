
<!DOCTYPE html>

    <title>Arithmetic Operators</title>

    <script src="../JAVA_SCRIPT_FILE/06-Arithmetic-Operators.js"></script>

<body>

    <script>
        document.write("<h2>Arithmetic Operators</h2>");

        document.write("Addition: " + addition + "<br>");
        document.write("Subtraction: " + subtraction + "<br>");
        document.write("Multiplication: " + multiplication + "<br>");
        document.write("Exponentiation: " + exponentiation + "<br>");

        document.write("<br>");

        document.write("Increment: " + increment + "<br>");
        document.write("Decrement: " + decrement);
    </script>
