<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Switch Case</title>
</head>
<body>
    <h1>JavaScript Switch Case</h1>
    <script src="../JAVA_SCRIPT_FILE/15-JavaScript-Switch-Case.js"></script>
    <!-- switch (expression) {
    case value1:
        // Code
        break;   if we don't use break then it will execute all the cases after the matched case until it finds a break statement or reaches the end of the switch statement.

    case value2:
        // Code
        break;

    default:
        // Default code
} -->
</body>
</html>
