
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Types In JavaScript</title>

    <script src="../JAVA_SCRIPT_FILE/05-Data-Types-In-Java-Script.js"></script>
</head>
<body>

    <script>
        document.write("<h2>Data Types In JavaScript</h2>");

        document.write(name + "<br>");
        document.write(age + "<br>");
        document.write(price + "<br>");
        document.write(isStudent + "<br>");
        document.write(x + "<br>");
        document.write(y + "<br>");
        document.write(z + "<br>");

        document.write("<br>");

        document.write(typeof name + "<br>");
        document.write(typeof age + "<br>");
        document.write(typeof price + "<br>");
        document.write(typeof isStudent + "<br>");
        document.write(typeof x + "<br>");
        document.write(typeof y + "<br>");
        document.write(typeof z + "<br>");

    </script>

</body>
</html>
