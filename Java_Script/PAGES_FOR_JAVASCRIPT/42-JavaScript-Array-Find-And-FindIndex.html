<!-- The find() and findIndex() methods are used to search for an element in an array based on a condition.
- find() returns the first element that satisfies the condition.
- findIndex() returns the index (position) of the first element that satisfies the condition.
If no element matches the condition:
- find() returns undefined.
- findIndex() returns -1. -->
